<!DOCTYPE html>
<html>
  <head>
    <title>Live Walking Tracker</title>
    <script src="https://maps.googleapis.com/maps/api/js?key=YOUR_API_KEY"></script>
    <style>
      html,
      body,
      #map {
        height: 100%;
        margin: 0;
        padding: 0;
      }
    </style>
  </head>
  <body>
    <div id="map"></div>

    <script>
      let map;
      let path = [];
      let polyline;

      function initMap() {
        const defaultLocation = { lat: 35.687, lng: -105.9378 };

        map = new google.maps.Map(document.getElementById("map"), {
          zoom: 18,
          center: defaultLocation,
        });

        polyline = new google.maps.Polyline({
          path: path,
          geodesic: true,
          strokeColor: "#FF0000",
          strokeOpacity: 1.0,
          strokeWeight: 3,
          map: map,
        });

        if (navigator.geolocation) {
          navigator.geolocation.watchPosition(
            (position) => {
              const current = {
                lat: position.coords.latitude,
                lng: position.coords.longitude,
              };

              path.push(current);
              polyline.setPath(path);

              map.setCenter(current); // Follow user
            },
            (error) => {
              console.error("Geolocation error:", error);
              alert("Location access denied. Cannot track.");
            },
            {
              enableHighAccuracy: true,
              maximumAge: 0,
              timeout: 10000,
            }
          );
        } else {
          alert("Geolocation is not supported by your browser.");
        }
      }

      window.onload = initMap;
    </script>
  </body>
</html>
