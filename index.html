<!DOCTYPE html>
<html>
  <head>
    <title>Walking Route Tracker</title>
    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBt3PASmroPAJoJxnDAlTdA9SEDbnRh1Zg"></script>
    <style>
      html,
      body,
      #map {
        height: 100%;
        margin: 0;
        padding: 0;
      }

      .btn {
        position: absolute;
        z-index: 999;
        padding: 12px 20px;
        font-size: 16px;
        border: none;
        border-radius: 8px;
        cursor: pointer;
      }

      #startBtn {
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        background-color: #28a745;
        color: white;
      }

      #stopBtn {
        top: 15px;
        left: 15px;
        background-color: #dc3545;
        color: white;
        display: none;
      }

      #saveBtn {
        top: 15px;
        right: 15px;
        background-color: #007bff;
        color: white;
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="map"></div>

    <button id="startBtn" class="btn">🚶 Start Tracking</button>
    <button id="stopBtn" class="btn">🛑 Stop</button>
    <button id="saveBtn" class="btn">💾 Save My Route</button>

    <script>
      let map,
        path = [],
        polyline,
        watchId = null,
        marker = null,
        lastLatLng = null;

      const arrowSVG = {
        path: "M 0 -2 L 5 0 L 0 2 L 0 1 L -5 1 L -5 -1 L 0 -1 Z", // bold triangle arrow
        fillColor: "#00cc66", // Spark green
        fillOpacity: 1,
        scale: 6, // Big & bold
        strokeColor: "black",
        strokeWeight: 2,
        rotation: 0,
        anchor: new google.maps.Point(0, 0),
      };

      function initMap() {
        const defaultLocation = { lat: 35.687, lng: -105.9378 };

        map = new google.maps.Map(document.getElementById("map"), {
          zoom: 19,
          center: defaultLocation,
          mapTypeId: "hybrid",
        });

        polyline = new google.maps.Polyline({
          path: path,
          geodesic: true,
          strokeColor: "#00BFFF",
          strokeOpacity: 1.0,
          strokeWeight: 6,
          map: map,
        });

        // Start tracking
        document.getElementById("startBtn").addEventListener("click", () => {
          document.getElementById("startBtn").style.display = "none";
          document.getElementById("stopBtn").style.display = "block";
          document.getElementById("saveBtn").style.display = "block";

          if (navigator.geolocation) {
            watchId = navigator.geolocation.watchPosition(
              (position) => {
                const current = {
                  lat: position.coords.latitude,
                  lng: position.coords.longitude,
                };

                path.push(current);
                polyline.setPath(path);
                map.setCenter(current);

                // Rotate Spark-style arrow
                const heading = computeHeading(lastLatLng, current);
                arrowSVG.rotation = heading;

                if (marker) {
                  marker.setPosition(current);
                  marker.setIcon(arrowSVG);
                } else {
                  marker = new google.maps.Marker({
                    position: current,
                    map: map,
                    icon: arrowSVG,
                    title: "You",
                  });
                }

                lastLatLng = current;
              },
              (error) => {
                console.error("Geolocation error:", error);
                alert("Location access denied.");
              },
              {
                enableHighAccuracy: true,
                maximumAge: 0,
                timeout: 10000,
              }
            );
          } else {
            alert("Geolocation is not supported by your browser.");
          }
        });

        // Stop tracking
        document.getElementById("stopBtn").addEventListener("click", () => {
          if (watchId !== null) {
            navigator.geolocation.clearWatch(watchId);
            watchId = null;
            alert("Tracking stopped.");
          }
        });

        // Save route to file
        document.getElementById("saveBtn").addEventListener("click", () => {
          if (path.length === 0) {
            alert("No path recorded yet.");
            return;
          }

          const blob = new Blob([JSON.stringify(path, null, 2)], {
            type: "application/json",
          });

          const url = URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.href = url;
          a.download = "my-walking-route.json";
          a.click();
          URL.revokeObjectURL(url);
        });
      }

      function computeHeading(from, to) {
        if (!from || !to) return 0;

        const fromLat = (from.lat * Math.PI) / 180;
        const fromLng = (from.lng * Math.PI) / 180;
        const toLat = (to.lat * Math.PI) / 180;
        const toLng = (to.lng * Math.PI) / 180;

        const dLng = toLng - fromLng;

        const y = Math.sin(dLng) * Math.cos(toLat);
        const x =
          Math.cos(fromLat) * Math.sin(toLat) -
          Math.sin(fromLat) * Math.cos(toLat) * Math.cos(dLng);
        const brng = Math.atan2(y, x);
        return ((brng * 180) / Math.PI + 360) % 360;
      }

      window.onload = initMap;
    </script>
  </body>
</html>
